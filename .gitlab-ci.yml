# GitLab CI for moonlight-common-c (C library, CMake).
# Linux build (OpenSSL) on the isolated Docker runner; Windows/macOS matrix stays
# on GitHub Actions. GitLab is the source of truth, publish-github mirrors it.
#
# Note: requires cmake, ninja-build, g++, libssl-dev on the runner VM
# (installed 2026-10-18 via apt).

stages:
  - build
  - package

variables:
  CMAKE_GENERATOR: Ninja
  CC: gcc
  CXX: g++

build-debug:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  stage: build
  timeout: 15 minutes
  tags: [linux-common]
  script:
    - git -c http.version=HTTP/1.1 submodule update --init --recursive --depth 1 --jobs 2
    - cmake -DCMAKE_BUILD_TYPE=Debug -B build_debug
    - cmake --build build_debug
    - |
      if [ -f build_debug/CTestTestfile.cmake ]; then
        ctest --test-dir build_debug --output-on-failure
      else
        echo "No CTest tests defined; compile gate only."
      fi

build-release:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  stage: build
  timeout: 15 minutes
  tags: [linux-common]
  script:
    - git -c http.version=HTTP/1.1 submodule update --init --recursive --depth 1 --jobs 2
    - cmake -DCMAKE_BUILD_TYPE=Release -B build_release
    - cmake --build build_release
    - ls -l build_release/libmoonlight-common-c*
  artifacts:
    paths:
      - build_release/libmoonlight-common-c*
    expire_in: 1 week

# GitHub mirror sync (same pattern as moonlight-macos-enhanced).
publish-github:
  stage: package
  tags: [gitlab-mirror]
  resource_group: github-mirror
  timeout: 10 minutes
  interruptible: false
  cache: {}
  dependencies: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - MIRROR_DRY_RUN=1 python3 scripts/ci/publish-github.py
    - python3 scripts/ci/publish-github.py
